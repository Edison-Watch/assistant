name: Pinned refs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pinned-refs:
    name: Pinned refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check images and actions are pinned
        run: python3 scripts/check_immutable_refs.py
